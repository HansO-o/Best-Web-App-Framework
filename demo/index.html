<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- no zoom, the page under the notch and the status bar -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#efefef">
<meta name="format-detection" content="telephone=no">
<!-- added to the home screen: full screen, the status bar clear over the page -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BWAF">
<link rel="icon" href="data:,">
<title>Best Web App Framework</title>
<script>
/* the theme this device chose last (Settings), before anything is drawn */
(function () {
  var mode = '';
  try { mode = localStorage.getItem('demo:theme') || ''; } catch (e) { /* storage blocked */ }
  if (mode === 'dark' || mode === 'light') document.documentElement.setAttribute('data-theme', mode);
})();
</script>
</head>
<body>
<!-- Safari on iOS, in a tab: a solid strip across the top edge keeps Safari's own blur off the page (core/core.css) -->
<div class="edge-top" aria-hidden="true"></div>
<div class="app" id="app"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
